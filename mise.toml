[tools]
chezmoi = "2.73.1"
node = "22.22.2"
vale = "3.26.0"

[tasks."test:platform"]
description = "Validate platform-specific Chezmoi boundaries and shell syntax"
run = "bash tests/test-platform-layout.sh"

[tasks."test:platform:render"]
description = "Render and validate Linux and macOS platform templates"
run = "bash tests/test-platform-rendering.sh"

[tasks."test:pi:skills"]
description = "Test Matt skill setup and explicit Addy cleanup without changing global skills"
run = "bash tests/test-pi-skills.sh && bash tests/test-pi-addy-skills.sh"

[tasks."test:pi:smart-zone"]
description = "Test the Pi smart-zone context status extension"
run = "node --test tests/test-pi-smart-zone.mjs"

[tasks."test:vale:changed"]
description = "Reject new Vale findings in changed Markdown files"
run = "bash tests/vale-new-findings.sh origin/main"

[tasks."test:pi:safety-gate"]
description = "Test Pi safety-gate decisions for local work and remote access"
run = "node --disable-warning=ExperimentalWarning --experimental-strip-types --test tests/test-pi-safety-gate.mjs"

[tasks."test:vale:baseline"]
description = "Test the baseline-aware Vale comparison"
run = "bash tests/test-vale-new-findings.sh"

[tasks."test:templates"]
description = "Render every Chezmoi template for darwin and linux"
run = "bash tests/test-all-templates-render.sh"

[tasks."test:renovate"]
description = "Verify README text still matches Renovate regex managers"
run = "bash tests/test-renovate-patterns.sh"
