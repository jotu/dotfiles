[tools]
chezmoi = "2.73.1"
node = "22.22.2"
vale = "latest"

[tasks."test:platform"]
description = "Validate platform-specific Chezmoi boundaries and shell syntax"
run = "bash tests/test-platform-layout.sh"

[tasks."test:platform:render"]
description = "Render and validate Linux and macOS platform templates"
run = "bash tests/test-platform-rendering.sh"

[tasks."test:pi:skills"]
description = "Test Matt and Addy Pi skill reconciliation without changing global skills"
run = "bash tests/test-pi-skills.sh && bash tests/test-pi-addy-skills.sh"
