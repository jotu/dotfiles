"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt for Herdr's Catppuccin Macchiato UI.
# Herdr owns workspaces, tabs, agents, and session state; Starship shows
# shell-local context such as the directory, Git state, and runtimes.

add_newline = true
command_timeout = 3000
palette = "catppuccin_macchiato"

format = '''
$directory$nix_shell$java$golang$python$nodejs$lua$kubernetes$cmd_duration
[$character](bold green)'''

right_format = """
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$terraform\
$aws\
$gcloud\
$openstack\
$azure\
$custom\
$status"""

[fill]
symbol = '.'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[package]
disabled = true

[cmd_duration]
min_time = 500
style = "yellow"

[aws]
disabled = false
format = 'on [$symbol$profile]($style)'
style = "italic peach"

# Cloud providers: keep disabled by default
[azure]
disabled = true
format = 'on [$symbol($subscription)]($style)'
style = "italic sapphire"

[gcloud]
disabled = true
format = 'on [$symbol$profile]($style)'
style = "italic blue"

[directory]
truncate_to_repo = true
style = "blue"

[docker_context]
disabled = false
style = "teal"

[git_branch]
style = "mauve"

[git_commit]
style = "overlay1"

[git_state]
style = "peach"

[git_status]
conflicted = '🏳'
ahead = '🏎💨'
behind = '😰'
diverged = '😵'
up_to_date = ''
untracked = '🤷'
stashed = ''
modified = '📝'
staged = '[++\($count\)](green)'
renamed = '👅'
deleted = '🗑'
disabled = false
style = "red"

[java]
format = "[${symbol}(${version} )]($style)"
style = "italic blue"

[golang]
disabled = false
format = "[ ${symbol}(${version} )]($style)"
style = "italic teal"

[nodejs]
disabled = false
style = "green"

[python]
disabled = false
style = "yellow"

[lua]
style = "mauve"

[kubernetes]
disabled = false
style = 'teal'
format = '[$symbol$context]($style) '

[[kubernetes.contexts]]
context_pattern = 'arn.*/(?P<cluster>.*)'
context_alias = "$cluster"
style = "italic teal"

[nix_shell]
disabled = false
impure_msg = 'devbox'
format = '[$symbol$state](bold blue)'

[sudo]
disabled = false
style = "red"

[status]
style = "red"

[time]
disabled = true
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic overlay1"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
