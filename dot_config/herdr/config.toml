# Shared Herdr defaults for focused local development.
# Agent-specific configuration stays in Pi and OpenCode.

[theme]
# Catppuccin Macchiato palette shared with Pi's catppuccin-macchiato theme.
name = "catppuccin"

[theme.custom]
sidebar_bg = "#1e2030"
active_row_bg = "#363a4f"
selection_bg = "#494d64"
panel_bg = "#24273a"
accent = "#8aadf4"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
surface_dim = "#363a4f"
surface0 = "#363a4f"
surface1 = "#494d64"
overlay0 = "#6e738d"
overlay1 = "#8087a2"
text = "#cad3f5"
subtext0 = "#a5adcb"
mauve = "#c6a0f6"
teal = "#8bd5ca"
peach = "#f5a97f"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[ui]
sidebar_width = 26
pane_borders = true
pane_outer_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents.rows_by_agent]
# Show Pi's native session name in the Agents pane.
pi = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
# Preserve the workspace without automatically restarting coding agents.
resume_agents_on_restore = false

[advanced]
scrollback_limit_bytes = 10000000
