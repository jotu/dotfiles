# AeroSpace window management defaults for macOS.
# The layout is intentionally small and predictable; visual theming is not
# exposed by AeroSpace, so the Herdr Catppuccin Macchiato palette remains
# managed by the terminal and other applications.

config-version = 2
# Workspaces are created on demand so they can follow the available monitors.
# Do not pin the logical workspace set to a particular physical display.

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

# Workspace conventions: 0 catch-all, 1 terminal, 2 browser, 3 Slack, 4 Teams, 5 notes, 6 security, 7 Mail, 8 media, 9 editors/coding.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.usebruno.app'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.github.GitHubClient'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'ch.protonmail.desktop'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'me.proton.pass.electron'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'ch.protonvpn.mac'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.jetbrains.goland'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.sublimetext.4'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'ai.opencode.desktop'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.apple.TV'
run = 'move-node-to-workspace 8'

# Keep small utility windows floating.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Unassigned applications go to the catch-all workspace.
[[on-window-detected]]
if = 'true'
run = 'move-node-to-workspace 0'

[mode.main.binding]
# Control+Option avoids intercepting macOS Option-based character shortcuts such as @.
# Layout
ctrl-alt-t = 'layout tiles horizontal vertical'
ctrl-alt-a = 'layout accordion horizontal vertical'
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
ctrl-alt-f = 'fullscreen'
ctrl-alt-shift-space = 'layout floating tiling'

# Focus
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'
ctrl-alt-left = 'focus-monitor left'
ctrl-alt-right = 'focus-monitor right'
ctrl-alt-shift-left = 'move-node-to-monitor left'
ctrl-alt-shift-right = 'move-node-to-monitor right'
ctrl-alt-tab = 'workspace-back-and-forth'

# Move windows
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# Workspaces
# 0 catch-all, 1 Terminal, 2 Browser, 3 Slack, 4 Teams, 5 Notes, 6 Security, 7 Mail, 8 Media, 9 Coding.
ctrl-alt-0 = 'workspace 0'
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'

ctrl-alt-shift-0 = 'move-node-to-workspace 0'
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-9 = 'move-node-to-workspace 9'

# Modes
ctrl-alt-r = 'mode resize'
ctrl-alt-s = 'mode service'

[mode.service.binding]
esc = 'mode main'
r = ['reload-config', 'mode main']
t = ['layout tiles horizontal vertical', 'mode main']
a = ['layout accordion horizontal vertical', 'mode main']
f = ['layout floating tiling', 'mode main']

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
