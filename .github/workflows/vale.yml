name: Vale Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  vale:
    name: Run Vale on Markdown
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: vale

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and Vale
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4

      - name: Reject new Vale findings
        env:
          VALE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: mise exec -- bash tests/vale-new-findings.sh "$VALE_BASE_REF"
