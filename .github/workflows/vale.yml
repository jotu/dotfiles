name: Vale Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  vale:
    name: Run Vale on Markdown
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: vale

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and Vale
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8

      - name: Reject new Vale findings
        env:
          VALE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: mise exec -- bash tests/vale-new-findings.sh "$VALE_BASE_REF"
